# Builds locally on first run — works on Windows, macOS (Intel and Apple Silicon)
# and Linux, because the base image is multi-arch.
services:
  vanguard:
    build: .
    image: vanguard-induction:latest
    container_name: vanguard
    ports:
      - "8080:80"        # noVNC desktop -> http://localhost:8080
    volumes:
      # The whole repository, not just src/. The handbook, the tooling, the
      # marker images and the provided packages all live outside src/, and none
      # of them are reachable from inside the container without this.
      - ..:/root/vanguard_ws
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
